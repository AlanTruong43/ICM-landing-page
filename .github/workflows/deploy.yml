name: Deploy to AWS

on:
  workflow_dispatch: # manual until AWS is set up; add "push: branches: [main]" afterwards

permissions:
  id-token: write # OIDC to AWS, no long-lived keys
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Hashed assets: cache for a year.
      - name: Sync hashed assets
        run: |
          aws s3 sync dist/_astro "s3://${{ vars.S3_BUCKET }}/_astro" \
            --cache-control "public,max-age=31536000,immutable" --delete
      # Everything else: revalidate each time so edits show up fast.
      - name: Sync the rest
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate" --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*"
